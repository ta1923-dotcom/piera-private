<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d1817"><meta name="description" content="Piera Private prototype"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Piera Private</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e6f3ef;background:#0d1817}*{box-sizing:border-box}body{margin:0;min-height:100dvh}.app{max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.head{padding:25px 20px 15px;border-bottom:1px solid #27413b}.brand{font-size:22px;letter-spacing:.08em;font-weight:800}.sub{color:#89b6a8;font-size:12px;margin-top:4px}.tabs{display:flex;gap:8px;padding:14px 16px}.tab{flex:1;border:1px solid #355a4e;background:#142621;color:#d5e9e3;border-radius:12px;padding:12px}.tab.active{background:#275543}.panel{padding:16px 20px;flex:1}.notice{border:1px solid #936c2b;color:#ffdfa4;background:#332b1c;border-radius:14px;padding:13px;font-size:13px;line-height:1.6}.card{margin-top:20px;border:1px solid #2c5145;border-radius:18px;padding:18px;background:#13251f}.label{color:#a7c7bd;font-size:13px}.id{font-size:20px;word-break:break-all;font-weight:700;padding:12px 0}.muted{color:#a9c7bb;font-size:13px;line-height:1.7}button.action{border:0;border-radius:12px;padding:13px 16px;background:#53ad86;color:#092018;font-weight:800;cursor:pointer}button.secondary{background:#213d34;color:#ddf4e9;border:1px solid #426b5e}input{width:100%;background:#0f1d19;color:#fff;border:1px solid #436358;border-radius:12px;padding:14px;font:inherit;margin:10px 0 14px}h2{font-size:19px}.chat{display:flex;flex-direction:column;gap:9px;margin:18px 0}.bubble{align-self:flex-end;background:#285841;border-radius:14px 14px 3px 14px;padding:12px;max-width:85%;word-break:break-word}.foot{padding:15px;text-align:center;color:#739b8a;font-size:12px}
</style></head><body><main class="app"><div class="head"><div class="brand">◈ PIERA PRIVATE</div><div class="sub">PRIVATE MESSENGER · PROTOTYPE 0.1</div></div><div class="tabs"><button class="tab active" data-panel="home">ホーム</button><button class="tab" data-panel="demo">画面テスト</button><button class="tab" data-panel="about">開発状況</button></div><section class="panel" id="view"></section><footer class="foot">Piera | Independent Creative Studio</footer></main><script>
const view=document.getElementById('view');const tabs=document.querySelectorAll('.tab');let messages=[];function safe(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(){return '<div class="notice">⚠ この試作品は通信・暗号化が未実装です。入力内容はこの画面に表示されるだけで、相手には送信されません。秘密情報は入力しないでください。</div>'}
function show(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.panel===name));if(name==='home'){view.innerHTML=notice()+'<div class="card"><div class="label">プロジェクト</div><div class="id">PIERA PRIVATE</div><p class="muted">電話番号なしの匿名メッセンジャーを目指すAndroid向けアプリ。次の開発工程で、実績ある暗号化プロトコルを用いた実通信を実装します。</p><button class="action" id="go">画面を試す</button></div>';document.getElementById('go').onclick=()=>show('demo')}
else if(name==='demo'){view.innerHTML=notice()+'<h2>チャット画面（ローカル表示のみ）</h2><div class="chat" id="chat">'+messages.map(m=>'<div class="bubble">'+safe(m)+'</div>').join('')+'</div><form id="form"><label for="msg" class="label">テスト用メッセージ</label><input id="msg" maxlength="500" autocomplete="off" placeholder="ここに入力"><button class="action" type="submit">画面に表示</button> <button class="action secondary" id="clear" type="button">消去</button></form>';document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=document.getElementById('msg');if(f.value.trim())messages.push(f.value.trim());show('demo')};document.getElementById('clear').onclick=()=>{messages=[];show('demo')}}
else{view.innerHTML='<h2>実装チェック</h2><div class="card"><p>✓ Android向け画面</p><p>✓ PWA基本ファイル</p><p>✓ チャット画面テスト</p><p>□ 匿名アカウント発行</p><p>□ Matrix連携・エンドツーエンド暗号化</p><p>□ 鍵と端末の検証</p><p>□ 2台間での送受信</p><p>□ セキュリティ監査</p></div><p class="muted">この段階で安全なメッセンジャーとして利用・販売することはできません。</p>'}}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.panel));show('home');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
