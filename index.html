<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d1817"><meta name="description" content="Piera Private prototype"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Piera Private</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e6f3ef;background:#0d1817}*{box-sizing:border-box}body{margin:0;min-height:100dvh}.app{max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.head{padding:25px 20px 15px;border-bottom:1px solid #27413b}.brand{font-size:22px;letter-spacing:.08em;font-weight:800}.sub{color:#89b6a8;font-size:12px;margin-top:4px}.tabs{display:flex;gap:6px;padding:14px 12px}.tabs .tab{font-size:12px;padding:11px 4px}.tab{flex:1;border:1px solid #355a4e;background:#142621;color:#d5e9e3;border-radius:12px;padding:12px}.tab.active{background:#275543}.panel{padding:16px 20px;flex:1}.notice{border:1px solid #936c2b;color:#ffdfa4;background:#332b1c;border-radius:14px;padding:13px;font-size:13px;line-height:1.6}.card{margin-top:20px;border:1px solid #2c5145;border-radius:18px;padding:18px;background:#13251f}.label{color:#a7c7bd;font-size:13px}.id{font-size:20px;word-break:break-all;font-weight:700;padding:12px 0}.muted{color:#a9c7bb;font-size:13px;line-height:1.7}button.action{border:0;border-radius:12px;padding:13px 16px;background:#53ad86;color:#092018;font-weight:800;cursor:pointer}button.secondary{background:#213d34;color:#ddf4e9;border:1px solid #426b5e}input{width:100%;background:#0f1d19;color:#fff;border:1px solid #436358;border-radius:12px;padding:14px;font:inherit;margin:10px 0 14px}h2{font-size:19px}.status{padding:13px;border-radius:12px;margin-top:12px;line-height:1.7;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.status.ok{background:#1d4635;color:#bff1d2}.status.fail{background:#49252a;color:#ffcdcd}.status.wait{background:#263a38;color:#d2e4df}label{display:block}.mono{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.chat{display:flex;flex-direction:column;gap:9px;margin:18px 0}.bubble{align-self:flex-end;background:#285841;border-radius:14px 14px 3px 14px;padding:12px;max-width:85%;word-break:break-word}.foot{padding:15px;text-align:center;color:#739b8a;font-size:12px}
</style></head><body><main class="app"><div class="head"><div class="brand">◈ PIERA PRIVATE</div><div class="sub">PRIVATE MESSENGER · PROTOTYPE 0.2</div></div><div class="tabs"><button class="tab active" data-panel="home">ホーム</button><button class="tab" data-panel="connect">通信確認</button><button class="tab" data-panel="demo">画面テスト</button><button class="tab" data-panel="about">開発状況</button></div><section class="panel" id="view"></section><footer class="foot">Piera | Independent Creative Studio</footer></main><script>
const view=document.getElementById('view');const tabs=document.querySelectorAll('.tab');let messages=[];function safe(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(){return '<div class="notice">⚠ この試作品は通信・暗号化が未実装です。入力内容はこの画面に表示されるだけで、相手には送信されません。秘密情報は入力しないでください。</div>'}
function show(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.panel===name));if(name==='home'){view.innerHTML=notice()+'<div class="card"><div class="label">プロジェクト</div><div class="id">PIERA PRIVATE</div><p class="muted">電話番号なしの匿名メッセンジャーを目指すAndroid向けアプリ。通信先のMatrixサーバーを検査する段階です。メッセージ送受信とエンドツーエンド暗号化はまだ実装していません。</p><button class="action" id="go">画面を試す</button></div>';document.getElementById('go').onclick=()=>show('demo')}
else if(name==='connect'){view.innerHTML=notice()+'<h2>Matrix サーバー接続診断</h2><p class="muted">サーバーの公開APIにアクセスして、応答を確認します。ログインやメッセージ送信は行いません。</p><div class="card"><label class="label" for="server">Matrix ホームサーバー</label><input id="server" value="https://matrix-client.matrix.org" inputmode="url" spellcheck="false" autocomplete="off"><button class="action" id="test">接続テスト</button><div id="result" role="status" aria-live="polite" class="status wait">未実行</div></div><p class="muted">パスワード・アクセストークン・回復鍵は入力しないでください。GitHub Pages上の試作版には秘密情報を保存しません。</p>';document.getElementById('test').onclick=probeMatrix}
else if(name==='demo'){view.innerHTML=notice()+'<h2>チャット画面（ローカル表示のみ）</h2><div class="chat" id="chat">'+messages.map(m=>'<div class="bubble">'+safe(m)+'</div>').join('')+'</div><form id="form"><label for="msg" class="label">テスト用メッセージ</label><input id="msg" maxlength="500" autocomplete="off" placeholder="ここに入力"><button class="action" type="submit">画面に表示</button> <button class="action secondary" id="clear" type="button">消去</button></form>';document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=document.getElementById('msg');if(f.value.trim())messages.push(f.value.trim());show('demo')};document.getElementById('clear').onclick=()=>{messages=[];show('demo')}}
else{view.innerHTML='<h2>実装チェック</h2><div class="card"><p>✓ Android向け画面</p><p>✓ PWA基本ファイル</p><p>✓ チャット画面テスト</p><p>✓ 公開Matrix API接続診断（Ver.0.2）</p><p>□ 匿名アカウント発行</p><p>□ Matrix連携・エンドツーエンド暗号化</p><p>□ 鍵と端末の検証</p><p>□ 2台間での送受信</p><p>□ セキュリティ監査</p></div><p class="muted">この段階で安全なメッセンジャーとして利用・販売することはできません。</p>'}}
async function probeMatrix(){const target=document.getElementById('server');const result=document.getElementById('result');const button=document.getElementById('test');let base;try{const u=new URL(target.value.trim());if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.pathname!=='/')throw Error('https:// から始まるサーバーURLを入力してください（パス不要）。');base=u.origin;}catch(e){result.className='status fail';result.textContent='入力エラー: '+e.message;return}button.disabled=true;result.className='status wait';result.textContent='通信確認中…';try{const ctl=new AbortController();const timeout=setTimeout(()=>ctl.abort(),9000);let response;try{response=await fetch(base+'/_matrix/client/versions',{signal:ctl.signal,cache:'no-store',headers:{'Accept':'application/json'}})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.versions))throw Error('Matrix APIとして認識できません');result.className='status ok';result.textContent='✓ Matrix公開APIに接続できました。\nサーバー: '+base+'\n対応API例: '+data.versions.slice(0,6).join(', ')+'\n\n※これは通信先の応答確認だけです。匿名性、ログイン、暗号化、安全性は確認していません。';}catch(e){result.className='status fail';result.textContent='接続を確認できませんでした。\n'+(e.name==='AbortError'?'タイムアウト':e.message)+'\n\nサーバーが稼働していても、ブラウザのCORS制限で失敗する場合があります。';}finally{button.disabled=false}}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.panel));show('home');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
